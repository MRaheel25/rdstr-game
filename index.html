<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RDSTR // Cold Gas Pursuit</title>
  <meta name="description" content="RDSTR: a high-speed 3D police pursuit game in the browser. Drive an electric roadster with cold-gas thrusters through the neon city of Halcyon Bay." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "postprocessing": "./vendor/postprocessing/postprocessing.js",
      "@dimforge/rapier3d-compat": "./vendor/rapier/rapier.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="radio" class="radio"></div>
    <div id="top-center">
      <div id="objective" class="hidden"><div class="obj-text"></div><div class="obj-timer"></div></div>
      <div id="style-score" class="hidden"><div class="score-total">0</div><div class="score-chain"><span class="chain-pts"></span><span class="chain-mult"></span></div></div>
    </div>
    <div id="popups"></div>
    <div id="hp-bar"><div class="hp-fill"></div><div class="hp-label">CHASSIS</div></div>
    <div id="player-tag"></div>
    <div id="nav-dist" class="hidden"></div>
    <div id="bottom-left">
      <div id="heat"><div class="stars"></div><div class="evade"><div class="evade-fill"></div><span class="evade-label"></span></div></div>
      <canvas id="minimap" width="220" height="220"></canvas>
    </div>
    <div id="dash">
      <div class="dash-speed">
        <canvas id="gauge" width="300" height="300"></canvas>
        <div id="speed-readout"><div class="speed">0</div><div class="unit">MPH</div></div>
        <div id="mode-indicator">TRACK</div>
        <div id="energy-readout"><span class="batt"></span><span class="temp"></span><span class="copv"></span></div>
      </div>
      <div class="nitro"><span class="dl">THRUST</span><div class="nitro-bar"></div><b>100%</b></div>
      <div class="batt-w"><svg viewBox="0 0 30 16"><rect x="1" y="2" width="25" height="12" rx="2.5"/><rect x="26.5" y="5.5" width="2.5" height="5" rx="1"/><path class="bolt" d="M14.5 4 10 9h3.5l-1.5 3.5L17 7h-3.5z"/></svg><div class="bw-bar"><i></i></div><b>100%</b></div>
      <div class="dash-low">
        <div class="car-w"><svg viewBox="0 0 40 70">
          <path class="z z-front" d="M10 6 Q20 0 30 6 L32 18 L8 18 Z"/>
          <path class="z z-rear" d="M8 52 L32 52 L31 63 Q20 68 9 63 Z"/>
          <path class="z z-left" d="M8 19 L13 19 L13 51 L8 51 Q5 35 8 19 Z"/>
          <path class="z z-right" d="M27 19 L32 19 Q35 35 32 51 L27 51 Z"/>
          <rect class="cab" x="14" y="21" width="12" height="28" rx="4"/>
        </svg><div class="cw-info"><span class="dl">CHASSIS</span><div class="cw-bar"><i></i></div><b>100%</b></div></div>
        <canvas id="thrust-view" width="88" height="88"></canvas>
      </div>
    </div>
    <div id="warnings"></div>
    <div id="prompt" class="hidden"></div>
    <div id="hints" class="hidden"></div>
    <div id="crack-overlay"></div>
  </div>

  <div id="debug" class="hidden"></div>
  <div id="loading"><div class="load-title">RDSTR</div><div class="load-sub">COLD GAS PURSUIT</div><div class="load-bar"><div class="load-fill"></div></div><div class="load-msg">Initializing…</div></div>
  <div id="ui-root"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
