<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RDSTR // Cold Gas Pursuit</title>
  <meta name="description" content="RDSTR: a high-speed 3D police pursuit game in the browser. Drive an electric roadster with cold-gas thrusters through the neon city of Halcyon Bay." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "postprocessing": "./vendor/postprocessing/postprocessing.js",
      "@dimforge/rapier3d-compat": "./vendor/rapier/rapier.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="radio" class="radio"></div>
    <div id="top-center">
      <div id="objective" class="hidden"><div class="obj-text"></div><div class="obj-timer"></div></div>
      <div id="style-score" class="hidden"><div class="score-total">0</div><div class="score-chain"><span class="chain-pts"></span><span class="chain-mult"></span></div></div>
    </div>
    <div id="popups"></div>
    <div id="hp-bar"><div class="hp-fill"></div><div class="hp-label">CHASSIS</div></div>
    <div id="cluster">
      <div class="gt batt"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="1.5"/><rect x="19.5" y="10" width="2" height="4"/><path d="M11 8.5 8 12.5h3l-1 3 3.5-4.2h-3l1-2.8z" class="ic-fill"/></svg><div class="gt-body"><div class="gt-head"><span>BATTERY</span><b>100%</b></div><div class="gt-bar"><i></i></div><div class="gt-sub"></div></div></div>
      <div class="gt hp"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.2 8 9 4.6-.8 8-4.5 8-9V6l-8-3z"/><path d="M9 12h6M12 9v6" class="ic-line"/></svg><div class="gt-body"><div class="gt-head"><span>CHASSIS</span><b>100%</b></div><div class="gt-bar"><i></i></div><div class="gt-sub"></div></div></div>
      <div class="gt copv"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="13" rx="4"/><path d="M10 18c0 2 2 3.5 2 3.5s2-1.5 2-3.5" class="ic-line"/><path d="M7 19c0 1.2.8 2 .8 2M17 19c0 1.2-.8 2-.8 2" class="ic-line"/></svg><div class="gt-body"><div class="gt-head"><span>THRUSTERS</span><b>100%</b></div><div class="gt-bar"><i></i></div><div class="gt-sub"></div></div></div>
      <canvas id="thrust-view" width="120" height="120"></canvas>
    </div>
    <div id="player-tag"></div>
    <div id="bottom-left">
      <div id="heat"><div class="stars"></div><div class="evade"><div class="evade-fill"></div><span class="evade-label"></span></div></div>
      <canvas id="minimap" width="220" height="220"></canvas>
    </div>
    <div id="bottom-right">
      <canvas id="gauge" width="300" height="300"></canvas>
      <div id="speed-readout"><div class="speed">0</div><div class="unit">MPH</div></div>
      <div id="mode-indicator">TRACK</div>
      <div id="energy-readout"><span class="batt">100%</span><span class="temp">32°C</span><span class="copv">COPV 100%</span></div>
    </div>
    <div id="warnings"></div>
    <div id="prompt" class="hidden"></div>
    <div id="hints" class="hidden"></div>
    <div id="crack-overlay"></div>
  </div>

  <div id="debug" class="hidden"></div>
  <div id="loading"><div class="load-title">RDSTR</div><div class="load-sub">COLD GAS PURSUIT</div><div class="load-bar"><div class="load-fill"></div></div><div class="load-msg">Initializing…</div></div>
  <div id="ui-root"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
